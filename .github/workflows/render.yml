name: PianoFall Automated Render Pipeline

on:
  schedule:
    # Runs twice per day at 02:00 UTC and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      max_videos:
        description: 'Number of videos to render in this batch (1-3)'
        required: false
        default: '1'
      test_seconds:
        description: 'Render only first N seconds (e.g. 15 for a trial, leave blank for full piece)'
        required: false
        default: ''
      piece_name:
        description: 'Target specific MIDI filename or substring (leave blank for next in queue)'
        required: false
        default: ''
      force_rebuild:
        description: 'Re-render even if already recorded in processed ledger'
        type: boolean
        default: false

# Prevent concurrent runs from colliding over git commits or display resources
concurrency:
  group: pianofall-render-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # 2.5 hour safety ceiling, well under GitHub's 6h limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system FFmpeg and Xvfb
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg xvfb
          ffmpeg -version | head -n 1
          which Xvfb
          echo "Display: ${DISPLAY:-not-set}"

      - name: Cache Playwright Chromium browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Verify package is importable from any directory
          python -c "import pianofall; print('pianofall package OK:', pianofall.__version__)"

      - name: Install Playwright Chromium & system OS dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: System and environment inspection
        run: |
          python -m pianofall inspect-system

      - name: Execute rendering pipeline
        env:
          INPUT_MAX_VIDEOS: ${{ inputs.max_videos || '1' }}
          INPUT_TEST_SECONDS: ${{ inputs.test_seconds }}
          INPUT_PIECE_NAME: ${{ inputs.piece_name }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pianofall render-batch

      - name: Upload diagnostic screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshots-${{ github.run_id }}
          path: data/debug_*.png
          if-no-files-found: ignore

      - name: Publish rendered videos to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Locate all newly rendered MP4 files
          VIDEOS=$(find outputs/ -type f -name "*.mp4")
          if [ -z "$VIDEOS" ]; then
            echo "No video files found in outputs/ to publish."
            exit 0
          fi

          echo "Found videos to publish as release assets:"
          echo "$VIDEOS"

          DATE_STR=$(date -u +'%Y.%m.%d')
          TAG="v${DATE_STR}-${{ github.run_number }}"
          TITLE="PianoFall Renders — ${DATE_STR} (Run #${{ github.run_number }})"

          NOTES="### 🎹 PianoFall Automated Visualization Batch
          - **Render Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Specifications**: 1920×1200 @ 60 FPS | H.264 CRF 16 (Studio Quality) | Silent
          - **Architecture**: Pure CPU SwiftShader rasterization + offline libx264 mastering

          #### 📦 Attached Video Assets:
          "

          for v in $VIDEOS; do
            FNAME=$(basename "$v")
            FSIZE=$(ls -lh "$v" | awk '{print $5}')
            NOTES="${NOTES}
          - **${FNAME}** (${FSIZE})"
          done

          echo "Publishing GitHub Release $TAG..."
          gh release create "$TAG" $VIDEOS \
            --title "$TITLE" \
            --notes "$NOTES"

          echo "Successfully published release $TAG with attached video assets."

      - name: Commit and push updated ledger state
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ledger updates (MP4s are excluded by .gitignore and stored in Releases)
          git add data/

          if git diff --staged --quiet; then
            echo "No ledger updates to commit."
          else
            git commit -m "chore(ledger): update render state and completion logs [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || {
              git rebase --abort
              git merge --no-edit "origin/$BRANCH"
            }
            git push origin "$BRANCH"
            echo "Successfully updated ledger state on $BRANCH."
          fi
